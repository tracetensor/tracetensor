<title>TraceTensor Banner</title>
<style>
  @font-face {
    font-family: 'Instrument Serif';
    src: local('Instrument Serif'), local('Georgia');
    font-weight: 400;
    font-style: italic;
  }

  :root {
    --ground: #0a0b0d;
    --grid-line: rgba(255,255,255,0.04);
    --grid-glow: rgba(90,210,180,0.06);
    --text-primary: #eef1f8;
    --text-dim: #7a8299;
    --accent-teal: #6dd8b0;
    --accent-ice: #a8d4e6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  .banner {
    width: 1280px;
    height: 640px;
    background: var(--ground);
    position: relative;
    overflow: hidden;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  /* Subtle grid pattern */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
    background-size: 32px 32px;
  }

  /* Teal glow, bottom-right quadrant */
  .glow {
    position: absolute;
    width: 700px;
    height: 500px;
    right: -50px;
    bottom: -100px;
    background: radial-gradient(ellipse at center, var(--grid-glow) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Logo area */
  .logo-row {
    position: absolute;
    top: 56px;
    left: 72px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-mark svg {
    width: 34px;
    height: 34px;
  }

  .logo-text {
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.01em;
    color: var(--text-primary);
  }

  /* Headline */
  .headline {
    position: absolute;
    top: 160px;
    left: 72px;
    right: 72px;
  }

  .headline h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: 76px;
    line-height: 1.08;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }

  .headline h1 em {
    font-style: italic;
    color: var(--accent-ice);
  }

  /* Subtitle */
  .subtitle {
    position: absolute;
    top: 388px;
    left: 72px;
    right: 200px;
    font-size: 18px;
    line-height: 1.6;
    color: var(--text-dim);
    letter-spacing: 0.005em;
  }

  /* Footer tags */
  .tags {
    position: absolute;
    bottom: 56px;
    left: 72px;
    display: flex;
    gap: 32px;
    align-items: center;
  }

  .tag {
    font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-teal);
  }

  .tag-sep {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--text-dim);
  }
</style>

<div class="banner">
  <div class="grid-overlay"></div>
  <div class="glow"></div>

  <!-- Logo -->
  <div class="logo-row">
    <div class="logo-mark">
      <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 3L27 24H3Z" stroke="#eef1f8" stroke-width="1.4" stroke-linejoin="round" fill="none"/>
        <circle cx="21" cy="11" r="6.5" stroke="#eef1f8" stroke-width="1.2" fill="#0a0b0d"/>
        <line x1="18.8" y1="8.8" x2="23.2" y2="13.2" stroke="#eef1f8" stroke-width="1.2"/>
        <line x1="23.2" y1="8.8" x2="18.8" y2="13.2" stroke="#eef1f8" stroke-width="1.2"/>
      </svg>
    </div>
    <span class="logo-text">TraceTensor</span>
  </div>

  <!-- Headline -->
  <div class="headline">
    <h1>Evaluate coding agents<br><em>on your terms.</em></h1>
  </div>

  <!-- Subtitle -->
  <p class="subtitle">
    Self-hosted evaluation for coding agents. Isolated Docker<br>
    sandboxes, reproducible pass/fail scores.
  </p>

  <!-- Tags -->
  <div class="tags">
    <span class="tag">Open Source</span>
    <span class="tag-sep"></span>
    <span class="tag">Apache 2.0</span>
    <span class="tag-sep"></span>
    <span class="tag">Local Docker</span>
  </div>
</div>
