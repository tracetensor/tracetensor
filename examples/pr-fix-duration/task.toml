schema_version = "1.3"

[task]
name = "tracetensor/pr-fix-duration"
description = "PR-style bugfix: make parse_duration() turn 1h30m-style strings into seconds."
authors = [{ name = "TraceTensor" }]
keywords = ["python", "bugfix", "pr", "parsing", "agent"]

[metadata]
difficulty_explanation = "Simple–mid string parsing with units and validation — PR-shaped coding agent eval."
category = "programming"

[verifier]
timeout_sec = 60.0

[agent]
timeout_sec = 400.0

[environment]
# public so installed agents (mini-swe, claude-code, …) can call model APIs from
# inside the container. Built-in host-side LLM agents also work.
network_mode = "public"
build_timeout_sec = 600.0
