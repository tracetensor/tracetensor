# TraceTensor — packaging + tooling config.
#
# `pip install -e backend` installs the package and exposes the `tracetensor`
# command (the CLI). The tool sections below give ruff / coverage / mypy one
# authoritative home so style + lint rules live in the repo and CI enforces them.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracetensor"
version = "0.1.0"
description = "Self-hosted platform for evaluating coding agents — CLI + web dashboard."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dynamic = ["dependencies"]  # single source of truth: requirements.txt

[project.scripts]
tracetensor = "app.cli.main:app"
tt = "app.cli.main:app"        # short alias

[tool.setuptools.packages.find]
# `app*` = the implementation; `tracetensor*` = the public API facade (see
# tracetensor/__init__.py). Both install together so `import tracetensor` works.
include = ["app*", "tracetensor*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# ----------------------------------------------------------------------
# ruff — linter + formatter (replaces black + flake8 + isort in one tool)
# ----------------------------------------------------------------------
[tool.ruff]
# 100 is this codebase's natural width (only ~20 lines exceed it); 88 would
# force gratuitous reflow of code that reads fine today.
line-length = 100
# The app supports 3.9+ (see requirements.txt tomli marker); the Docker image
# is 3.11. Target the floor so we don't lint in features 3.9 can't run.
target-version = "py310"
extend-exclude = ["venv", ".venv", "migrations/versions"]

[tool.ruff.lint]
# Deliberately lean: pyflakes (real bugs: unused imports/names), pycodestyle
# errors/warnings (style), and isort (import order). Not enabling opinionated
# refactor packs (UP/B/etc.) — they'd churn working code for little gain and
# turn "green CI" into a moving target. Add them later, rule by rule, on purpose.
select = ["E", "W", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Test scripts (a) insert the app dir on sys.path before importing app.* — a
# required ordering, not a mistake (E402); and (b) embed fixture blobs — shell
# scripts, TOML task files, multipart bodies — where a hard 100-col limit fights
# the literal content (E501). App code stays strict on both.
"tests/*" = ["E402", "E501"]
# Alembic's generated env/migration scaffolding has its own conventions.
"migrations/*" = ["E402", "F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ----------------------------------------------------------------------
# coverage.py — measured over the deterministic suites (see tests/run_ci.py).
# We don't chase 100%; the goal is to KNOW what's untested, not to game a number.
# ----------------------------------------------------------------------
[tool.coverage.run]
source = ["app"]
branch = true
# parallel: each suite (and the e2e's uvicorn server, which the e2e launches
# under its own `coverage run -p` so the ROUTERS it exercises are counted) writes
# a separate data file; `coverage combine` merges them. Without this the routers
# would read as untested even though the e2e drives them fully end to end.
parallel = true
concurrency = ["thread"]
# The e2e stops its server with SIGTERM; without this, coverage would discard
# that process's data on the way out. sigterm installs a handler that flushes it.
sigterm = true
# The LLM provider calls and the Docker exec plumbing are exercised by the
# key-gated / Docker e2e suites, not the deterministic runner — excluding them
# here keeps the tracked number honest about what the fast suite actually covers.
omit = [
    "app/__init__.py",
    "migrations/*",
    # A payload, not backend code: it is shipped into the sandbox and executed by
    # the CONTAINER's Python, so host-side coverage structurally cannot observe
    # it however well it is tested. Counting it would read as 0% forever and drag
    # the tracked number away from what the backend's own tests actually cover.
    # Its behaviour is covered by GraphFactoryShapeTests plus the real runs.
    "app/services/agents/_langgraph_runner.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",  # Protocol/stub bodies
]

# ----------------------------------------------------------------------
# mypy — type-check in LENIENT mode, enforced as a BLOCKING gate over ALL of app/.
#
# This codebase wasn't written type-first, so full STRICT mypy would emit a lot
# of annotation noise. Instead we run lenient (catch real bugs: wrong calls, None
# bugs; tolerate missing annotations) and enforce it — CI fails on any type
# error, across every module (the earlier per-module quarantine is now empty).
# Tightening the lenient flags toward strict is the remaining ratchet.
# ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true      # anthropic/openai/etc. ship partial stubs
# Ratchet: each of these was flipped on only after the errors it surfaced were
# fixed for real, never silenced. Keep going in that order.
check_untyped_defs = true          # ON — bodies of unannotated functions are checked
warn_return_any = true             # ON — an annotation must be a promise the code keeps
disallow_untyped_defs = true       # ON — every function carries a signature
warn_unused_ignores = false
no_implicit_optional = true
exclude = ["venv", "migrations", "tests"]
# Tests ARE type-checked, but by a separate invocation — see `mypy-tests` in
# scripts/, wired into CI. Two reasons they can't just be included here:
#   * `disallow_untyped_defs` on 200 test functions is noise, not signal; a
#     test's own signature tells a reader nothing.
#   * The pre-pytest script suites and the pydantic shim are dynamic on purpose
#     (the shim synthesizes module attributes at import), so checking them
#     produces errors that describe the design rather than a defect.
# The pytest suites — where a fake drifting from the real interface is a genuine
# bug — are checked with --allow-untyped-defs and are clean.

# Tests ARE type-checked — a wrong attribute or a bad call in a test is a real
# bug, and an untested test is worse than no test. What they're exempt from is
# `disallow_untyped_defs`: annotating `-> None` on 200 test functions is noise
# that hides the signal, and a test's own signature carries no information a
# reader needs. Their bodies are still checked.

# BaseEnvironment declares its interface as `...`-body stubs (idiomatic); those
# aren't "missing return" bugs.
disable_error_code = ["empty-body"]
